[package]
name = "flux-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# preserve_order: JSON.stringify en JS respeta el orden de insercion y el mapa
# por defecto de serde_json ordena las claves. Sin esto, extraer un objeto
# entero daria un texto distinto en la app y en el CLI.
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
boa_engine = "0.21.1"
# Para los built-ins dinamicos ({{$guid}}, {{$isoTimestamp}}): un UUID v4 de
# verdad y una fecha ISO-8601 son cosas que no conviene escribir a mano.
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# El binario se empaqueta dentro de la app como recurso, asi que su tamano
# cuenta en el instalador. Estas tres opciones no cambian el comportamiento,
# solo alargan la compilacion.
[profile.release]
lto = true
codegen-units = 1
strip = true
