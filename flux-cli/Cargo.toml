[package]
name = "flux-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
boa_engine = "0.21.1"

# El binario se empaqueta dentro de la app como recurso, asi que su tamano
# cuenta en el instalador. Estas tres opciones no cambian el comportamiento,
# solo alargan la compilacion.
[profile.release]
lto = true
codegen-units = 1
strip = true
