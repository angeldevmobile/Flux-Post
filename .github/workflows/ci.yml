name: CI

# The release workflow only runs on v* tags, so without this nothing checked
# the code before it shipped.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Pinned, not @stable: with -D warnings below, every Rust release can
      # turn a lint that did not exist yesterday into a red main. That is what
      # broke CI on 0.2.0. Bump this deliberately, not by the calendar.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./flux-cli -> target

      # Must come first: tauri.conf.json declares this binary as a bundled
      # resource, so src-tauri's build script fails without it. On Linux the
      # binary is `flux`, but the resource path names it `flux.exe`.
      - name: Build flux-cli
        run: |
          cargo build --release --manifest-path flux-cli/Cargo.toml
          cp flux-cli/target/release/flux flux-cli/target/release/flux.exe

      # No `cargo fmt --check`: rustfmt strips the padding from the
      # `//    Section    ` banners, forcing a whole-tree reformat.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings

      - name: Clippy (flux-cli)
        run: cargo clippy --manifest-path flux-cli/Cargo.toml -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Includes the assertion contract table, which must stay in step with the
      # one in src/lib/__tests__/assertions.test.ts.
      - name: Tests (flux-cli)
        run: cargo test --manifest-path flux-cli/Cargo.toml
