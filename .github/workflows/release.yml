name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Same version as ci.yml so what is checked is what is shipped.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./flux-cli -> target

      - name: Build flux-cli
        shell: bash
        run: |
          if [ -n "${{ matrix.args }}" ]; then
            TARGET=$(echo "${{ matrix.args }}" | sed 's/--target //')
            cargo build --release --target "$TARGET" --manifest-path flux-cli/Cargo.toml
            mkdir -p flux-cli/target/release
            cp "flux-cli/target/${TARGET}/release/flux" flux-cli/target/release/flux.exe
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cargo build --release --manifest-path flux-cli/Cargo.toml
          else
            cargo build --release --manifest-path flux-cli/Cargo.toml
            cp flux-cli/target/release/flux flux-cli/target/release/flux.exe
          fi

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Flux ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Downloads

            | Platform | File |
            |---|---|
            | Windows | `Flux_*_x64-setup.exe` |
            | macOS (Apple Silicon) | `Flux_*_aarch64.dmg` |
            | macOS (Intel) | `Flux_*_x64.dmg` |
            | Linux | `Flux_*_amd64.deb` / `Flux-*.x86_64.rpm` / `Flux_*_amd64.AppImage` |

            The `.sig` files and `latest.json` are for the auto-updater, not
            for downloading. The AppImage bundles WebKitGTK, so it is ~88 MB
            against ~15 MB for the `.deb`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
